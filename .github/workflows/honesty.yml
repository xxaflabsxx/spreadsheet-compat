# The site's whole claim is that every verdict on it was executed and is
# labelled with where it came from, and the checker and audit are what turn
# that data into advice about a visitor's own workbook. All five suites used
# to run only when a tick remembered to run them. This runs them on every
# push and pull request instead.
name: guards and tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Both guards read only the built docs/ and data/ files and import
      # nothing outside the standard library, so there is no install step.
      - name: Provenance and execution claims
        run: python3 scripts/check_honesty.py
      - name: Every referenced cell is set up
        run: python3 scripts/check_test_setup_refs.py
      # The checker and the migration audit are the money path: they decide
      # what a visitor is told about their own workbook. No package.json, no
      # dependencies -- plain node against committed fixtures.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compatibility checker tests
        run: node site/test-checker.mjs
      - name: Migration audit tests
        run: node site/audit-page/test.mjs
      - name: Migration audit adversarial tests
        run: node site/audit-page/test-adversarial.mjs
